[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lemma-pipeline"
version = "0.2.0"
description = "AI formalization pipeline, compiler report generator and verification-priority scorer for the Lemma type system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sumer Vaid", email = "svaid@hbs.edu" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
lemma = "lemma.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lemma*"]

[tool.setuptools.package-data]
lemma = ["prompts/*.md", "site_assets/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "N", "SIM"]
# Layout is enforced by `ruff format`; E501 would only flag long table and message strings.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
